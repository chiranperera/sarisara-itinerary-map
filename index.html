<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lanka Tour Itinerary Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100%;
        }

        /* Input Section - Left 40% */
        .input-section {
            width: 40%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow-y: auto;
        }

        /* Map Section - Right 60% */
        .map-section {
            width: 60%;
            height: 100vh;
            background-color: #e0e0e0;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .input-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 24px;
        }

        h3 {
            color: white;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #locationInput {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Zoom Control Section */
        .zoom-control {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .zoom-control h3 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .zoom-input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .zoom-input-group label {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        #zoomValue {
            color: #667eea;
            font-weight: bold;
        }

        #zoomSlider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #667eea, #764ba2);
            outline: none;
            cursor: pointer;
        }

        #zoomSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #zoomSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: none;
        }

        .zoom-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
        }

        .secondary-btn {
            background: #ff6b6b;
            color: white;
        }

        .optimize-btn {
            background: #4ecdc4;
            color: white;
        }

        .itinerary-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            min-height: 120px;
        }

        #locationsList {
            margin-bottom: 15px;
            min-height: 50px;
        }

        .location-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .location-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .location-name {
            font-weight: 500;
            color: #333;
            font-size: 16px;
        }

        .remove-btn {
            padding: 8px 20px;
            font-size: 14px;
            background: #ff6b6b;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .input-section {
                width: 100%;
                height: 50vh;
            }

            .map-section {
                width: 100%;
                height: 50vh;
            }

            .form-group {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Location Input Section (Left 40%) -->
        <div class="input-section">
            <div class="input-container">
                <h2>Add Destination</h2>
                <div class="form-group">
                    <input
                        type="text"
                        id="locationInput"
                        placeholder="Enter location in Sri Lanka (e.g., Colombo, Kandy, Galle)"
                        autocomplete="off"
                    >
                    <button id="addLocationBtn">Add Location</button>
                </div>

                <!-- Zoom Control Section -->
                <div class="zoom-control">
                    <h3>Map Zoom Level</h3>
                    <div class="zoom-input-group">
                        <label for="zoomSlider">Zoom: <span id="zoomValue">7.5</span></label>
                        <input
                            type="range"
                            id="zoomSlider"
                            min="0"
                            max="15"
                            step="0.5"
                            value="7.5"
                        >
                        <div class="zoom-labels">
                            <span>0 (Very Far)</span>
                            <span>15 (Close)</span>
                        </div>
                    </div>
                </div>

                <div class="itinerary-list">
                    <h3>Your Itinerary</h3>
                    <div id="locationsList">
                        <div class="empty-message">No destinations added yet. Start planning your journey!</div>
                    </div>
                    <div class="action-buttons">
                        <button id="clearAllBtn" class="secondary-btn">Clear All</button>
                        <button id="optimizeRouteBtn" class="optimize-btn">Optimize Route</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Section (Right 60%) -->
        <div class="map-section">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Global variables
        let map;
        let markers = [];
        let locations = [];
        let directionsService;
        let directionsRenderer;
        let geocoder;

        // Sri Lanka center coordinates
        const SRI_LANKA_CENTER = { lat: 7.8731, lng: 80.7718 };

        // Sri Lanka bounds to restrict map view
        const SRI_LANKA_BOUNDS = {
            north: 10.0,
            south: 5.9,
            west: 79.5,
            east: 82.0
        };

        // This function will be called by Google Maps API
        function initMap() {
            console.log('Initializing map...');

            // Create map centered on Sri Lanka with flexible zoom
            map = new google.maps.Map(document.getElementById('map'), {
                center: SRI_LANKA_CENTER,
                zoom: 7.5,
                minZoom: 0,
                maxZoom: 15,
                restriction: {
                    latLngBounds: SRI_LANKA_BOUNDS,
                    strictBounds: false
                },
                mapTypeControl: true,
                streetViewControl: false,
                fullscreenControl: true,
                zoomControl: true
            });

            console.log('Map initialized successfully');

            // Initialize services
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: false,
                polylineOptions: {
                    strokeColor: '#667eea',
                    strokeWeight: 4,
                    strokeOpacity: 0.8
                }
            });
            geocoder = new google.maps.Geocoder();

            // Set up autocomplete
            const input = document.getElementById('locationInput');
            const autocomplete = new google.maps.places.Autocomplete(input, {
                componentRestrictions: { country: 'lk' },
                fields: ['formatted_address', 'geometry', 'name']
            });

            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();
                if (place.geometry) {
                    addLocationFromPlace(place);
                }
            });

            // Set up event listeners
            document.getElementById('addLocationBtn').addEventListener('click', addLocation);
            document.getElementById('clearAllBtn').addEventListener('click', clearAll);
            document.getElementById('optimizeRouteBtn').addEventListener('click', optimizeRoute);

            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addLocation();
                }
            });

            // Zoom control event listener
            const zoomSlider = document.getElementById('zoomSlider');
            const zoomValue = document.getElementById('zoomValue');

            zoomSlider.addEventListener('input', function() {
                const zoom = parseFloat(this.value);
                zoomValue.textContent = zoom;
                map.setZoom(zoom);
            });

            // Update slider when map zoom changes (via map controls)
            map.addListener('zoom_changed', function() {
                const currentZoom = map.getZoom();
                zoomSlider.value = currentZoom;
                zoomValue.textContent = currentZoom.toFixed(1);
            });

            console.log('All event listeners set up');
        }

        function addLocationFromPlace(place) {
            const location = {
                name: place.name || place.formatted_address,
                address: place.formatted_address,
                lat: place.geometry.location.lat(),
                lng: place.geometry.location.lng()
            };

            addLocationToItinerary(location);
            document.getElementById('locationInput').value = '';
        }

        function addLocation() {
            const input = document.getElementById('locationInput');
            const locationName = input.value.trim();

            if (!locationName) {
                alert('Please enter a location');
                return;
            }

            geocoder.geocode({
                address: locationName + ', Sri Lanka',
                componentRestrictions: { country: 'lk' }
            }, function(results, status) {
                if (status === 'OK' && results[0]) {
                    const location = {
                        name: locationName,
                        address: results[0].formatted_address,
                        lat: results[0].geometry.location.lat(),
                        lng: results[0].geometry.location.lng()
                    };
                    addLocationToItinerary(location);
                    input.value = '';
                } else {
                    alert('Location not found in Sri Lanka. Please try again.');
                }
            });
        }

        function addLocationToItinerary(location) {
            locations.push(location);

            const marker = new google.maps.Marker({
                position: { lat: location.lat, lng: location.lng },
                map: map,
                title: location.name,
                label: {
                    text: String(locations.length),
                    color: 'white',
                    fontWeight: 'bold'
                },
                animation: google.maps.Animation.DROP
            });

            markers.push(marker);
            updateLocationsList();
            drawRoute();
            map.panTo({ lat: location.lat, lng: location.lng });
        }

        function updateLocationsList() {
            const listContainer = document.getElementById('locationsList');

            if (locations.length === 0) {
                listContainer.innerHTML = '<div class="empty-message">No destinations added yet. Start planning your journey!</div>';
                return;
            }

            listContainer.innerHTML = '';

            locations.forEach((location, index) => {
                const item = document.createElement('div');
                item.className = 'location-item';
                item.innerHTML = `
                    <div class="location-info">
                        <div class="location-number">${index + 1}</div>
                        <div class="location-name">${location.name}</div>
                    </div>
                    <button class="remove-btn" onclick="removeLocation(${index})">Remove</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function removeLocation(index) {
            locations.splice(index, 1);
            markers[index].setMap(null);
            markers.splice(index, 1);

            markers.forEach((marker, i) => {
                marker.setLabel({
                    text: String(i + 1),
                    color: 'white',
                    fontWeight: 'bold'
                });
            });

            updateLocationsList();
            drawRoute();
        }

        function clearAll() {
            if (locations.length === 0) return;

            if (confirm('Are you sure you want to clear all locations?')) {
                locations = [];
                markers.forEach(marker => marker.setMap(null));
                markers = [];
                directionsRenderer.setMap(null);
                directionsRenderer.setMap(map);
                updateLocationsList();
                map.setCenter(SRI_LANKA_CENTER);
                map.setZoom(7.5);
            }
        }

        function drawRoute() {
            if (locations.length < 2) {
                directionsRenderer.setDirections({ routes: [] });
                return;
            }

            const waypoints = locations.slice(1, -1).map(loc => ({
                location: { lat: loc.lat, lng: loc.lng },
                stopover: true
            }));

            const request = {
                origin: { lat: locations[0].lat, lng: locations[0].lng },
                destination: { lat: locations[locations.length - 1].lat, lng: locations[locations.length - 1].lng },
                waypoints: waypoints,
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, function(result, status) {
                if (status === 'OK') {
                    markers.forEach(marker => marker.setMap(null));
                    markers = [];

                    directionsRenderer.setDirections(result);

                    locations.forEach((location, index) => {
                        const marker = new google.maps.Marker({
                            position: { lat: location.lat, lng: location.lng },
                            map: map,
                            title: location.name,
                            label: {
                                text: String(index + 1),
                                color: 'white',
                                fontWeight: 'bold'
                            }
                        });
                        markers.push(marker);
                    });
                }
            });
        }

        function optimizeRoute() {
            if (locations.length < 3) {
                alert('Add at least 3 locations to optimize the route');
                return;
            }

            const waypoints = locations.slice(1, -1).map(loc => ({
                location: { lat: loc.lat, lng: loc.lng },
                stopover: true
            }));

            const request = {
                origin: { lat: locations[0].lat, lng: locations[0].lng },
                destination: { lat: locations[locations.length - 1].lat, lng: locations[locations.length - 1].lng },
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, function(result, status) {
                if (status === 'OK') {
                    const route = result.routes[0];
                    const newOrder = [locations[0]];

                    route.waypoint_order.forEach(index => {
                        newOrder.push(locations[index + 1]);
                    });

                    newOrder.push(locations[locations.length - 1]);
                    locations = newOrder;

                    markers.forEach(marker => marker.setMap(null));
                    markers = [];

                    updateLocationsList();
                    drawRoute();
                }
            });
        }
    </script>

    <!-- Load Google Maps API with callback -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAMzYuTtdxUK58Zu3Bo-WI7_yP1cuRZvdY&libraries=places&callback=initMap" async defer></script>
</body>
</html>
